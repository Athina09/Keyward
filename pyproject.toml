[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyward"
version = "0.1.0"
description = "Let an AI agent use your keys and money only with your yes, and within your limits."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
keywords = ["ai-agents", "secrets", "credentials", "approvals", "llm", "security", "payments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
keyward = "keyward.cli:main"

[tool.setuptools]
packages = ["keyward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
